{% load static %}
<!doctype html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ចុះឈ្មោះ | PNK Mobile</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --primary-color: #7fad39;
            --dark-color: #2c3e50;
        }

        body {
            font-family: "Kantumruy Pro", sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url("https://images.unsplash.com/photo-1616348436168-de43ad0db179?q=80&w=1000&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h2 { color: var(--dark-color); font-weight: 700; margin-top: 10px; }

        /* លាក់ Help Text ដែលរញេរញៃរបស់ Django */
        .helptext, .help-block, form ul {
            display: none !important;
        }

        /* រចនាប្រឡោះបំពេញទិន្នន័យ */
        form p {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fdfdfd;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(127, 173, 57, 0.2);
            outline: none;
        }

        /* បង្ហាញ Error ឱ្យស្អាត (សំខាន់ខ្លាំង) */
        .errorlist {
            display: block !important;
            color: #d9534f;
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-register {
            background: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-weight: 700;
            width: 100%;
            color: white;
            transition: 0.3s;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #6a922d;
            transform: translateY(-1px);
        }

        .login-link { color: var(--primary-color); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo-area">
            <i class="fas fa-user-plus fa-3x" style="color: var(--primary-color)"></i>
            <h2>បង្កើតគណនីថ្មី</h2>
            <p class="text-muted small">សូមបំពេញព័ត៌មានខាងក្រោមដើម្បីចុះឈ្មោះ</p>
        </div>

        <form method="POST" novalidate>
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert alert-danger py-2 small">
                    {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                </div>
            {% endif %}

            <!-- បង្ហាញ Form (Help Text ត្រូវបានលាក់ដោយ CSS) -->
            {{ form.as_p }}

            <button type="submit" class="btn-register">
                <i class="fas fa-check-circle mr-2"></i> ចុះឈ្មោះឥឡូវនេះ
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">មានគណនីរួចហើយ?</span>
            <a href="{% url 'login' %}" class="login-link small ml-1">ចូលប្រើប្រាស់</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
