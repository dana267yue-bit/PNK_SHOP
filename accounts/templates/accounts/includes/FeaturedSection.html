{% load static %}

<!-- FEATURED PRODUCTS SECTION -->
<section class="py-5">
  <div class="container">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark position-relative d-inline-block pb-2">
        ផលិតផលពិសេស
        <span class="position-absolute bottom-0 start-50 translate-middle-x bg-success rounded-pill" style="height: 4px; width: 60px;"></span>
      </h2>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
      {% for product in products %}
      <div class="col">
        <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden card-product text-center p-3">
          {% url 'ShopDetails' product.id as the_url %}

          <!-- PRODUCT IMAGE -->
          <a href="{{ the_url }}" class="d-block overflow-hidden rounded-3 mb-3">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid product-img" style="height: 190px; object-fit: contain;">
          </a>

          <!-- BRAND & DETAILS -->
          <div class="card-body p-0 d-flex flex-column justify-content-between">
            <div>
              <small class="text-uppercase text-muted fw-semibold d-block mb-1" style="font-size: 11px; letter-spacing: 1px;">
                {{ product.brand.name }}
              </small>

              <h6 class="card-title fw-bold text-dark text-truncate mb-2">
                <a href="{{ the_url }}" class="text-decoration-none text-dark hover-success">{{ product.name }}</a>
              </h6>

              <div class="text-warning mb-2" style="font-size: 13px;">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
              </div>

              <h5 class="fw-bold text-success mb-3">${{ product.price }}</h5>
            </div>

            <div>
              <a href="{{ the_url }}" class="btn btn-outline-success btn-sm rounded-pill w-100 fw-bold">
                <i class="bi bi-eye me-1"></i> មើលលម្អិត
              </a>
            </div>
          </div>

        </div>
      </div>
      {% endfor %}
    </div>

  </div>
</section>
