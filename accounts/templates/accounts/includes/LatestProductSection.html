{% load static %}

<!-- LATEST PRODUCTS SECTION -->
<section class="py-4 bg-light">
  <div class="container">
    <div class="row gy-4">
      {% for category, title in sections %}
      <div class="col-lg-4 col-md-6">
        <div class="bg-white p-4 rounded-4 shadow-sm h-100 border">
          <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
            <i class="bi bi-fire text-success me-2"></i>{{ title }}
          </h5>

          <div class="d-flex flex-column gap-3">
            {% for product in products %}
            {% if product.category == category %}
            <a href="{% url 'ShopDetails' product.id %}" class="d-flex align-items-center gap-3 text-decoration-none p-2 rounded-3 hover-light transition-all">
              <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-3" style="width: 60px; height: 60px; object-fit: contain;">
              <div>
                <h6 class="fw-bold text-dark mb-1 small">{{ product.name }}</h6>
                <span class="fw-bold text-success">${{ product.price|floatformat:2 }}</span>
              </div>
            </a>
            {% endif %}
            {% endfor %}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
