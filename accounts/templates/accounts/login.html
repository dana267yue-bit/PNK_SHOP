<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PNK Mobile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .login-card p {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            height: auto;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.15);
            border-color: #007bff;
        }
        .btn-login {
            background-color: #007bff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ចូលប្រើប្រាស់</h2>
        <p>សូមបញ្ចូលព័ត៌មានគណនីរបស់អ្នក</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small text-center" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
                <input type="text" name="username" class="form-control" placeholder="បញ្ចូល Username" required>
            </div>
            <div class="form-group">
                <label>លេខសម្ងាត់</label>
                <input type="password" name="password" class="form-control" placeholder="បញ្ចូល Password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">login</button>
        </form>

        <div class="footer-text">
            មិនទាន់មានគណនី? <a href="{% url 'register' %}" class="text-primary font-weight-bold">ចុះឈ្មោះនៅទីនេះ</a>
        </div>
    </div>

</body>
</html>
