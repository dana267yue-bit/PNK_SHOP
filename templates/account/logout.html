{% load static %}
<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាកចេញពីគណនី - PNK Mobile Store</title>

    <!-- Google Fonts (Kantumruy Pro & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #064e3b 100%);
            font-family: 'Kantumruy Pro', 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Decorative ambient glow circles */
        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 450px;
            height: 450px;
            background: rgba(239, 68, 68, 0.12);
            filter: blur(140px);
            border-radius: 50%;
            pointer-events: none;
        }

        .logout-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 42px 36px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: cardAppear 0.4s ease-out forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 16px;
            border-radius: 50px;
            color: #059669;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.15);
        }

        .logout-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .logout-subtitle {
            color: #64748b;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-confirm-logout {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-confirm-logout:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(239, 68, 68, 0.4);
            color: #ffffff;
        }

        .btn-cancel-logout {
            width: 100%;
            height: 48px;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            background: #f8fafc;
            color: #334155;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-cancel-logout:hover {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
            text-decoration: none;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <!-- Ambient Glowing Background Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="logout-card">
        
        <!-- Store Brand Badge -->
        <div class="brand-badge">
            <img src="{% if store_settings.logo %}{{ store_settings.logo.url }}{% else %}{% static 'img/photologo.JPG' %}{% endif %}" alt="{{ store_settings.store_name|default:'PNK Logo' }}" height="22" class="rounded-circle">
            <span>{{ store_settings.store_name|default:"PNK MOBILE STORE" }}</span>
        </div>

        <!-- Warning Icon -->
        <div class="icon-circle">
            <i class="bi bi-box-arrow-right"></i>
        </div>

        <!-- Title & Subtitle -->
        <h4 class="logout-title">ចាកចេញពីគណនី</h4>
        <p class="logout-subtitle">តើអ្នកពិតជាចង់ចាកចេញពីគណនី <strong>PNK Mobile Store</strong> របស់លោកអ្នកមែនទេ?</p>

        <!-- Logout Action Form -->
        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn-confirm-logout">
                <i class="bi bi-box-arrow-right"></i>
                ចាកចេញពីគណនី
            </button>

            <a href="{% url 'core:home' %}" class="btn-cancel-logout">
                <i class="bi bi-house-door"></i>
                ត្រឡប់ទៅទំព័រដើម
            </a>
        </form>

    </div>

</body>
</html>
